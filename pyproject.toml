[project]
name = "corp-hub-agent"
version = "0.1.0"
description = "Push agent for Corp-Hub: sysinfo, network connections, logs"
requires-python = ">=3.11"

dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]

[project.scripts]
corp-hub-agent = "corp_hub_agent.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["corp_hub_agent*"]
