name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller psutil
      - run: pyinstaller packaging/linux.spec
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/corp-hub-agent
          name: corp-hub-agent ${{ github.ref_name }}
